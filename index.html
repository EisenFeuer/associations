<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Associations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener('error', function (e) {
        var pre = document.createElement('pre');
        pre.style.cssText =
          'position:fixed;left:0;right:0;bottom:0;z-index:99;margin:0;padding:10px 14px;background:#3a1010;color:#ffd0d0;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap';
        pre.textContent = e.message + '\n' + e.filename + ':' + e.lineno;
        document.body.appendChild(pre);
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
